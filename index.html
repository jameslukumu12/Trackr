<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trackr — Your career search, organised.</title><link rel="stylesheet" href="/styles.css"></head><body>
<div id="toast"></div>
<aside class="sidebar"><div class="brand"><span class="brandmark">T</span><span>Trackr.</span></div><nav id="nav">
<button class="active" data-view="dashboard">⌂ <span>Dashboard</span></button><button data-view="applications">▦ <span>Applications</span></button><button data-view="email">✉ <span>Email Sync</span></button><button data-view="interviews">◷ <span>Interviews</span></button><button data-view="contacts">◎ <span>Contacts</span></button><button data-view="documents">▤ <span>Documents</span></button><button data-view="analytics">⌁ <span>Analytics</span></button></nav><div class="sidebar-bottom"><button data-view="settings">⚙ <span>Settings</span></button><div class="mini-profile"><div class="avatar">JL</div><div><b>James L</b><small>Career workspace</small></div></div></div></aside>
<main><header><div><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle">Your career search, organised.</p></div><button class="primary" id="addBtn">+ Add application</button></header><section id="content"></section></main>
<div class="modal" id="modal"><div class="modal-card"><button class="close" id="closeModal">×</button><h2>Add application</h2><form id="appForm" class="form-grid"><label>Company<input name="company" required></label><label>Role<input name="role" required></label><label>Location<input name="location"></label><label>Stage<select name="stage"><option>Saved</option><option>Applying</option><option>Applied</option><option>Assessment</option><option>Interview</option><option>Final Stage</option><option>Offer</option><option>Rejected</option></select></label><label>Date applied<input type="date" name="dateApplied"></label><label>Deadline<input type="date" name="deadline"></label><label class="full">Job link<input name="link" type="url"></label><label class="full">Notes<textarea name="notes"></textarea></label><button class="primary full" type="submit">Save application</button></form></div></div>
<script src="/app.js"></script></body></html>
